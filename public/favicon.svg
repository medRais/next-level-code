<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Next Level Code">
  <!--
    The ≡ signature mark. The full wordmark is illegible at 16px, so the
    favicon carries the glyph alone. Solid ink ground rather than a
    transparent one, so the mark holds up against both light and dark
    browser chrome.
  -->
  <rect width="32" height="32" rx="6" fill="#0B1220"/>
  <g fill="#FAFBFC">
    <rect x="7" y="9" width="18" height="3"/>
    <rect x="7" y="14.5" width="18" height="3"/>
    <rect x="7" y="20" width="18" height="3"/>
  </g>
</svg>
