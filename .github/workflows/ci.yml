name: CI

# The deploy workflow only runs on `main`, which stays untouched until
# cutover. This job is what actually catches breakage while the site is being
# built on `new-site`: same install, same checks, same build — no deploy, and
# no Pages permissions.
on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Type check and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Build
        run: npm run build

      - name: Verify custom domain file
        run: |
          test -f dist/CNAME || { echo "::error::dist/CNAME is missing — the custom domain would be dropped on deploy."; exit 1; }
          echo "CNAME → $(cat dist/CNAME)"
