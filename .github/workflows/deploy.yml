name: Deploy to GitHub Pages

# Fires only on `main`. Until the new site is merged, `main` still carries the
# old live site and this workflow does not exist there — so nothing deploys
# before cutover. See the cutover checklist in DEPLOYMENT.md.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy in flight: a half-published site is worse than a
# slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Build
        run: npm run build

      # `public/CNAME` is copied verbatim into dist/ by Astro, which is what
      # keeps the custom domain bound on every deploy.
      - name: Verify custom domain file
        run: |
          test -f dist/CNAME || { echo "::error::dist/CNAME is missing — the custom domain would be dropped on deploy."; exit 1; }
          echo "CNAME → $(cat dist/CNAME)"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
